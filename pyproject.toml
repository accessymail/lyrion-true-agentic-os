[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrion-true-agentic-os"
version = "0.1.0"
description = "LYRION True Agentic OS — a secure, modular, production-grade agentic operating system."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "UNLICENSED" }
authors = [
    { name = "ANIKET" }
]

dependencies = [
    "fastapi>=0.120,<1.0",
    "uvicorn[standard]>=0.39,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.11,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "opentelemetry-api>=1.37,<2.0",
    "opentelemetry-sdk>=1.37,<2.0",
    "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.13,<1.0",
    "mypy>=1.17,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra"]
markers = [
    "integration: requires an external PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["lyrion"]

[tool.coverage.report]
show_missing = true
skip_covered = true
