name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.4"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tools/phase_b

      - name: Lint
        run: ruff check src tests tools/phase_b

      - name: Type check
        run: python -m mypy src

      - name: Test
        run: python -m pytest --import-mode=importlib -q

      - name: Enforce active repository surface
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files -- 'Library/**' 'NOT_USABLE_DOCUMENTS/**' 'Manifest.md')"
          test -z "$forbidden"
